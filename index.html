<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="AI Promotion：把一个想法，变成可以打开的网页。">
  <title>AI Promotion · 网页实验</title>
  <style>
    :root { color-scheme: light; --ink: #19332c; --muted: #626e65; --accent: #28654b; --paper: #f5f4ed; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 1060px; margin: auto; padding: 34px 32px 24px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding-bottom: 24px; border-bottom: 1px solid #d6dcd1; }
    .brand { font-size: 15px; font-weight: 750; letter-spacing: .08em; }
    .tag { color: var(--muted); font-size: 12px; }
    .hero { padding: 76px 0 50px; }
    .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .15em; font-weight: 700; }
    h1 { font-size: clamp(36px, 6vw, 65px); font-weight: 650; line-height: 1.3; letter-spacing: -.04em; margin: 22px 0; }
    .intro { max-width: 610px; font-size: 17px; line-height: 1.9; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 12px 0 32px; }
    article { min-height: 185px; padding: 26px; background: #fffef9; border: 1px solid #dce0d6; border-radius: 18px; }
    .number { color: var(--accent); font-size: 12px; font-weight: 700; }
    h2 { margin: 20px 0 10px; font-size: 21px; }
    article p { margin: 0; font-size: 14px; line-height: 1.8; color: var(--muted); }
    .experiment { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 28px; border-radius: 18px; background: #e6ecdf; }
    .experiment h2 { margin: 0 0 6px; font-size: 17px; }
    .experiment p { margin: 0; color: #45564a; font-size: 14px; line-height: 1.7; }
    button { border: none; border-radius: 999px; background: var(--accent); color: white; padding: 14px 23px; min-height: 48px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
    button:hover { background: #1c5039; }
    button:focus-visible { outline: 3px solid #bd8836; outline-offset: 4px; }
    footer { display: flex; justify-content: space-between; gap: 12px; padding-top: 32px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    @media (max-width: 640px) { main { padding: 24px 20px; } .hero { padding-top: 48px; } .grid { grid-template-columns: 1fr; } article { min-height: auto; padding: 22px; } h2 { margin-top: 12px; } .experiment { align-items: flex-start; flex-direction: column; } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">AI PROMOTION</span><span class="tag">一个轻量的网页实验</span></header>
    <section class="hero" aria-labelledby="title">
      <div class="eyebrow">LEARN · BUILD · ITERATE</div>
      <h1 id="title">让一个想法，<br>成为可以打开的网页。</h1>
      <p class="intro">从一页开始，把描述变成界面，把体验变成反馈。这个小实验用来验证网页发布与交互的完整流程。</p>
    </section>
    <section class="grid" aria-label="从想法到网页">
      <article><span class="number">01 / 描述</span><h2>说清要解决的问题</h2><p>明确用户、使用场景，以及最重要的一件事。</p></article>
      <article><span class="number">02 / 验证</span><h2>让想法可以被体验</h2><p>用一个简单页面，检查内容、布局和交互。</p></article>
      <article><span class="number">03 / 迭代</span><h2>根据反馈继续改进</h2><p>先跑通最小流程，再逐步完善功能。</p></article>
    </section>
    <section class="experiment" aria-labelledby="experiment-title">
      <div><h2 id="experiment-title">试一下页面交互</h2><p id="result" role="status" aria-live="polite">点击右侧按钮，看看页面如何回应。</p></div>
      <button id="try-button" type="button">点亮这个实验 ↗</button>
    </section>
    <noscript><p>浏览器未启用 JavaScript，页面内容可阅读，互动按钮暂不可用。</p></noscript>
    <footer><span>AI Promotion · 从理解到实践</span><span>纯静态页面 · 不收集个人信息</span></footer>
  </main>
  <script>
    (() => {
      let count = 0;
      const result = document.getElementById('result');
      const button = document.getElementById('try-button');
      button.addEventListener('click', () => {
        count += 1;
        result.textContent = `交互成功！你已点亮这个实验 ${count} 次。`;
        button.textContent = '再试一次 ↗';
      });
    })();
  </script>
</body>
</html>
